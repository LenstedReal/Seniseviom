<!DOCTYPE html>
<html lang="tr" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <title>Seni Seviyorum - 100 Languages</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght=700;900&display=swap');
    
    * { 
      margin: 0; padding: 0; box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      height: 100vh;
      width: 100vw;
      background: #000;
      color: #fff;
      font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden !important;
      position: relative;
      user-select: none;
    }

    canvas#bgParticles {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      display: block;
      background: radial-gradient(circle at center, #100010 0%, #000000 80%);
    }

    .main-layout {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw; 
      height: 100vh;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(55px, 7vh, 85px) 0;
      pointer-events: none;
    }

    @media (min-width: 768px) {
      .main-layout {
        height: 100%;
        max-height: 820px; 
        justify-content: center;
        gap: 35px;
        padding: 20px 0;
      }
    }

    .button-cloud {
      width: 98%;
      max-width: 1300px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr)); 
      gap: 3px;
      padding: 4px;
      pointer-events: auto;
    }
    
    @media (min-width: 768px) {
      .button-cloud {
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: 5px;
      }
    }

    .center-stage {
      width: 90%;
      max-width: 600px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
      pointer-events: auto;
    }

    .glow-text {
      font-size: clamp(1.2rem, 4.5vw, 2.6rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      line-height: 1.2;
      color: #fff;
      text-shadow:
        0 0 10px #FF005C,
        0 0 30px #FF005C,
        0 0 60px #FF005C,
        0 0 100px #FF005C;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .heart {
      font-size: clamp(2.3rem, 7.5vw, 3.5rem);
      cursor: pointer;
      animation: pulse 1.3s infinite ease-in-out;
      filter: drop-shadow(0 0 6px #FF005C);
      transition: transform 0.1s;
      line-height: 1;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #FF005C); }
      50% { transform: scale(1.2); filter: drop-shadow(0 0 20px #FF4A85) saturate(1.3); }
    }

    button.lang-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 4, 4, 0.9);
      border: 1.2px solid #FF005C;
      border-radius: 4px;
      color: #FF005C;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      height: clamp(24px, 3.3vh, 38px);
      font-size: clamp(8px, 1.15vh, 10.5px);
      padding: 2px 4px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color 0.1s, background 0.1s, box-shadow 0.1s;
      box-shadow: 0 0 6px rgba(255, 0, 92, 0.2);
    }

    @media (max-width: 767px) {
      button.lang-btn.long-text {
        font-size: clamp(6.2px, 0.9vh, 8px) !important;
        letter-spacing: -0.05em !important;
      }
    }

    @media (min-width: 768px) {
      button.lang-btn {
        font-size: 11px;
        letter-spacing: 0.02em;
      }
      button.lang-btn.long-text {
        font-size: 9.5px;
        letter-spacing: -0.02em;
      }
      button.lang-btn:hover {
        background: rgba(255, 0, 92, 0.15);
        box-shadow: 0 0 8px #FF005C;
      }
    }
    
    button.lang-btn:active { transform: scale(0.95); }
    button.lang-btn.active {
      background: #FF005C;
      color: #000;
      box-shadow: 0 0 12px #FF005C, inset 0 0 2px #fff;
    }

    .toggle-panel {
      position: fixed;
      top: clamp(12px, 1.8vh, 25px); 
      right: 15px;
      z-index: 10;
      pointer-events: auto;
    }
    
    .toggle-panel button {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 4px;
      color: #00F0FF;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 10px;
      padding: 3px 8px;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.1);
      transition: background 0.2s, border-color 0.2s;
    }

    @media (min-width: 768px) {
      .toggle-panel {
        top: 20px;
        right: 25px;
      }
      .toggle-panel button {
        font-size: 12px;
        padding: 5px 12px;
      }
    }
  </style>
</head>

  const bottomGrid = document.getElementById("bottomGrid");
  const toggleBtn = document.getElementById("toggleLang");
  const audio = document.getElementById("phonkAudio");
  const clickSound = document.getElementById("clickSound");

  const heartCombo = ["💗", "🖤", "❤️‍🩹"];
  let heartIndex = 0;
  let currentLang = "tr";
  let currentUiLang = "tr";
  let audioUnlocked = false;

  function renderGrids() {
    topGrid.innerHTML = "";
    bottomGrid.innerHTML = "";
    
    const keys = Object.keys(phrases);
    const half = 50; 
    const topKeys = keys.slice(0, half);
    const bottomKeys = keys.slice(half);

    const createBtn = (lang) => {
      const btn = document.createElement("button");
      btn.className = "lang-btn";
      if (lang === currentLang && window.userHasClicked) btn.classList.add("active");
      
      const labelText = currentUiLang === "tr" ? phrases[lang].tr : phrases[lang].en;
      btn.textContent = labelText;
      if (labelText.length > 10) btn.classList.add("long-text");
      
      btn.onclick = () => {
        window.userHasClicked = true;
        currentLang = lang;
        updateDisplay();
        setActiveButton();
        speakIt();
        playAudio();
        clickSound.currentTime = 0;
        clickSound.play().catch(()=>{});
      };
      return btn;
    };

    topKeys.forEach(lang => topGrid.appendChild(createBtn(lang)));
    bottomKeys.forEach(lang => bottomGrid.appendChild(createBtn(lang)));
  }

  function setActiveButton() {
    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.classList.remove("active");
      const targetText = currentUiLang === "tr" ? phrases[currentLang].tr : phrases[currentLang].en;
      if (btn.textContent === targetText) btn.classList.add("active");
    });
  }

  function updateDisplay() {
    display.textContent = phrases[currentLang].text;
    heart.textContent = heartCombo[heartIndex];
  }

  heart.onclick = () => {
    heartIndex = (heartIndex + 1) % heartCombo.length;
    updateDisplay();
    speakIt();
    playAudio();
    clickSound.currentTime = 0;
    clickSound.play().catch(()=>{});
  };

  toggleBtn.onclick = () => {
    currentUiLang = currentUiLang === "tr" ? "en" : "tr";
    toggleBtn.textContent = currentUiLang === "tr" ? "TR" : "EN";
    renderGrids();
    updateDisplay();
  };

  function playAudio() { 
    audio.volume = 0.4;
    audio.play().catch(() => {
        // Tarayıcı kısıtlamasına takılırsa sessiz kal, hata verme
    });
  }

  function speakIt() {
    if ('speechSynthesis' in window) {
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(phrases[currentLang].text);
      utter.lang = phrases[currentLang].v;
      utter.rate = 1.15; 
      speechSynthesis.speak(utter);
    }
  }

  renderGrids();
  updateDisplay();

  const canvas = document.getElementById('bgParticles');
  const ctx = canvas.getContext('2d');
  let w, h, particlesArray = [];

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.size = Math.random() * 2 + 1;
      this.speedX = (Math.random() - 0.5) * 0.8;
      this.speedY = (Math.random() - 0.5) * 0.8;
      this.color = `rgba(255, 0, 92, ${Math.random() * 0.5 + 0.5})`;
    }
    update() {
      this.x += this.speedX; this.y += this.speedY;
      if(this.x > w) this.x = 0; else if(this.x < 0) this.x = w;
      if(this.y > h) this.y = 0; else if(this.y < 0) this.y = h;
    }
    draw() {
      ctx.beginPath();
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 15;
      ctx.fillStyle = this.color;
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function initParticles() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    particlesArray = [];
    for (let i = 0; i < 120; i++) particlesArray.push(new Particle());
  }

  function animateParticles() {
    ctx.clearRect(0, 0, w, h);
    for (let p of particlesArray) { p.update(); p.draw(); }
    requestAnimationFrame(animateParticles);
  }

  window.addEventListener("resize", () => {
    if(Math.abs(w - window.innerWidth) > 30 || Math.abs(h - window.innerHeight) > 30) {
      initParticles();
    }
  });

  initParticles();
  animateParticles();

  setInterval(() => {
    heartIndex = (heartIndex + 1) % heartCombo.length;
    updateDisplay();
  }, 15000);
</script>
</body>
</html>
